<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Party — Совместный просмотр Rutube и VK Видео</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-page: #09090b;
      --bg-surface: #121215;
      --bg-elevated: #18181c;
      --bg-hover: #222228;
      --border: #27272a;
      --border-subtle: #1f1f23;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent-primary: #f4f4f5;
      --accent-primary-text: #09090b;
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --blue-border: rgba(59, 130, 246, 0.3);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --green-border: rgba(34, 197, 94, 0.28);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.28);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --red-border: rgba(239, 68, 68, 0.28);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Верхняя панель навигации и загрузки видео */
    .topbar {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--text-primary);
      color: var(--bg-page);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .divider-v {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-dot.online {
      background: var(--green);
    }

    .status-dot.error {
      background: var(--red);
    }

    .room-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .topbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .name-field {
      display: inline-flex;
      align-items: center;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      height: 34px;
      gap: 6px;
    }

    .name-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .name-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 500;
      width: 110px;
      outline: none;
    }

    .url-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .input-text {
      flex: 1;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input-text::placeholder {
      color: var(--text-muted);
    }

    .input-text:focus {
      border-color: #52525b;
    }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: #3f3f46;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-solid {
      background: var(--accent-primary);
      color: var(--accent-primary-text);
      border-color: var(--accent-primary);
      font-weight: 600;
    }

    .btn-solid:hover:not(:disabled) {
      background: #e4e4e7;
      border-color: #e4e4e7;
    }

    .btn-blue {
      background: var(--blue-bg);
      color: #60a5fa;
      border-color: var(--blue-border);
    }

    .btn-blue:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .btn-sm {
      height: 28px;
      padding: 0 9px;
      font-size: 0.76rem;
    }

    /* Основная сетка: Плеер слева, Панель синхронизации и участников справа */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 16px;
      align-items: start;
    }

    .player-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .player-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .player-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 8px;
      background: #0c0c0f;
      pointer-events: none;
    }

    .player-empty.hidden {
      display: none;
    }

    .player-empty-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .player-empty-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      max-width: 420px;
    }

    /* Панель управления под плеером */
    .transport-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .transport-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .transport-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .local-readout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
    }

    .timecode-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Правая колонка: Участники и синхронизация */
    .sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .panel-title {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
    }

    /* Блок объяснения текущего ориентира синхронизации */
    .sync-summary-box {
      padding: 10px 14px;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sync-target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.79rem;
    }

    .sync-target-label {
      color: var(--text-secondary);
    }

    .sync-target-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .auto-sync-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .auto-sync-toggle input {
      accent-color: var(--blue);
      cursor: pointer;
    }

    /* Список участников */
    .participants-list {
      display: flex;
      flex-direction: column;
      divide-y: 1px solid var(--border-subtle);
      max-height: 380px;
      overflow-y: auto;
    }

    .participant-item {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background-color 0.12s ease;
    }

    .participant-item:last-child {
      border-bottom: none;
    }

    .participant-item.is-target {
      background: rgba(59, 130, 246, 0.05);
    }

    .participant-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .participant-identity {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .participant-name {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .role-tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .role-tag.host {
      color: #93c5fd;
      border-color: var(--blue-border);
      background: var(--blue-bg);
    }

    .role-tag.target {
      color: #86efac;
      border-color: var(--green-border);
      background: var(--green-bg);
    }

    .participant-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .state-And-time {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .state-badge.playing {
      color: #4ade80;
      background: var(--green-bg);
      border-color: var(--green-border);
    }

    .state-badge.paused {
      color: #fbbf24;
      background: var(--amber-bg);
      border-color: var(--amber-border);
    }

    .state-badge.unstarted {
      color: var(--text-muted);
    }

    .drift-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 0.73rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-page);
      color: var(--text-secondary);
    }

    .drift-badge.synced {
      color: #4ade80;
      border-color: var(--green-border);
      background: var(--green-bg);
    }

    .drift-badge.warn {
      color: #fbbf24;
      border-color: var(--amber-border);
      background: var(--amber-bg);
    }

    .participant-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Лог событий */
    .log-list {
      padding: 10px 14px;
      height: 170px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--bg-page);
    }

    .log-item {
      display: flex;
      gap: 8px;
      line-height: 1.35;
      word-break: break-word;
    }

    .log-ts {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-text {
      color: var(--text-secondary);
    }

    .log-item.sync .log-text {
      color: #93c5fd;
    }

    .log-item.peer .log-text {
      color: #86efac;
    }

    .log-item.warn .log-text {
      color: #fcd34d;
    }

    @media (max-width: 1080px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        padding: 10px;
      }
      .url-row {
        flex-direction: column;
      }
      .transport-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .transport-left,
      .transport-right {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Верхняя панель -->
    <header class="topbar">
      <div class="topbar-main">
        <div class="brand-group">
          <div class="brand-title">
            <span class="brand-icon">WP</span>
            <span>Watch Party</span>
          </div>
          <div class="divider-v"></div>
          <div class="status-pill" id="connectionBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Подключение...</span>
          </div>
          <div class="room-code" id="roomCodeLabel" title="ID текущей комнаты">Комната: ...</div>
        </div>

        <div class="topbar-controls">
          <div class="name-field" title="Ваше имя, которое видят друзья в списке участников">
            <label for="userNameInput">Имя:</label>
            <input type="text" id="userNameInput" class="name-input" maxlength="20" placeholder="Ваше имя" />
          </div>
          <button class="btn" id="copyRoomBtn" type="button">Скопировать ссылку</button>
          <button class="btn" id="newRoomBtn" type="button" title="Создать новую комнату">Новая комната</button>
        </div>
      </div>

      <div class="url-row">
        <input
          type="text"
          id="videoUrlInput"
          class="input-text"
          placeholder="Вставьте ссылку на видео Rutube или VK Видео (или код встраивания iframe)..."
          autocomplete="off"
        />
        <button class="btn btn-solid" id="loadVideoBtn" type="button">Загрузить для всех</button>
      </div>
    </header>

    <!-- Основная рабочая область -->
    <div class="workspace">
      <!-- Левая колонка: Плеер и управление -->
      <div class="player-column">
        <main class="player-frame-wrap">
          <div class="player-empty" id="playerPlaceholder">
            <div class="player-empty-title">Видео не выбрано</div>
            <div class="player-empty-desc">
              Вставьте ссылку на ролик с Rutube или VK Видео в верхнее поле и нажмите «Загрузить для всех».
            </div>
          </div>
          <iframe
            id="videoPlayer"
            src="about:blank"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write"
            allowfullscreen
          ></iframe>
        </main>

        <!-- Панель прямого контроля и синхронизации под плеером -->
        <div class="transport-bar">
          <div class="transport-left">
            <button class="btn btn-solid" id="togglePlayPauseBtn" type="button" title="Запустить или поставить на паузу у всех">
              Play / Пауза
            </button>
            <button class="btn" id="seekBackBtn" type="button" title="Перемотать на 10 секунд назад у всех">-10с</button>
            <button class="btn" id="seekForwardBtn" type="button" title="Перемотать на 10 секунд вперед у всех">+10с</button>
            <div class="local-readout">
              <span id="localStateLabel" class="state-badge">Ожидание</span>
              <span id="localTimeLabel" class="timecode-mono">00:00</span>
            </div>
          </div>

          <div class="transport-right">
            <button class="btn btn-blue" id="forceSyncBtn" type="button" title="Принудительно выставить всем участникам ваше текущее время и статус">
              Раздать моё время всем
            </button>
            <button class="btn" id="pullSyncBtn" type="button" title="Синхронизировать ваш плеер с выбранным ориентиром или комнатой">
              Выровняться с комнатой
            </button>
          </div>
        </div>
      </div>

      <!-- Правая колонка: Участники, их таймкоды и журнал -->
      <aside class="sidebar-column">
        <section class="panel-card">
          <div class="panel-header">
            <div class="panel-title">
              <span>Участники и время</span>
              <span class="count-badge" id="peerCount">1</span>
            </div>
            <label class="auto-sync-toggle" title="Автоматически подравнивать ваш плеер, если время разошлось с ориентиром более чем на 2 сек.">
              <input type="checkbox" id="autoSyncCheckbox" checked />
              <span>Авто-подстройка</span>
            </label>
          </div>

          <div class="sync-summary-box">
            <div class="sync-target-row">
              <span class="sync-target-label">К кому вы синхронизируетесь:</span>
              <span class="sync-target-value" id="syncTargetLabel">Все (по Хосту)</span>
            </div>
          </div>

          <div class="participants-list" id="participantsList"></div>
        </section>

        <section class="panel-card">
          <div class="panel-header">
            <div class="panel-title">Журнал событий</div>
            <button class="btn btn-sm" id="clearLogBtn" type="button">Очистить</button>
          </div>
          <div class="log-list" id="eventLog" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- Константы синхронизации ---
      const SYNC_THRESHOLD_SEC = 1.5;      // Порог рассинхрона при проверке во время воспроизведения
      const PAUSE_SYNC_THRESHOLD = 0.4;    // При паузе выравниваем таймкод, если расхождение >= 0.4 сек
      const DRIFT_BEACON_THRESHOLD = 1.8;  // Порог авто-коррекции накопленной задержки во время игры
      const REMOTE_LOCK_MS = 750;          // Защита от эхо-цикла (feedback loop) при программных командах
      const PLAY_SEEK_LEAD_SEC = 0.25;     // Небольшая компенсация сетевой задержки при перемотке на лету

      // Конфигурация STUN серверов для обхода NAT и VPN в WebRTC (PeerJS)
      const PEERJS_CONFIG = {
        debug: 0,
        config: {
          iceCandidatePoolSize: 10,
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' }
          ]
        }
      };

      // --- Вспомогательные функции ---
      function formatTimecode(seconds) {
        if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '00:00';
        const total = Math.floor(seconds);
        const hrs = Math.floor(total / 3600);
        const mins = Math.floor((total % 3600) / 60);
        const secs = total % 60;
        const mm = String(mins).padStart(2, '0');
        const ss = String(secs).padStart(2, '0');
        return hrs > 0 ? `${hrs}:${mm}:${ss}` : `${mm}:${ss}`;
      }

      function formatSignedDelta(deltaSec) {
        const sign = deltaSec > 0 ? '+' : '';
        return `${sign}${deltaSec.toFixed(1)}с`;
      }

      function getLiveCurrentTime() {
        if (localState === 'playing' && hasVideoStartedOnce && !isLocalBuffering && lastTimeUpdateWallClock > 0) {
          const elapsedSec = (Date.now() - lastTimeUpdateWallClock) / 1000;
          if (elapsedSec > 0 && elapsedSec < 1.5) {
            return localCurrentTime + elapsedSec;
          }
        }
        return localCurrentTime;
      }

      function getPeerLiveTime(peerInfo) {
        if (!peerInfo || typeof peerInfo.time !== 'number') return 0;
        if (peerInfo.state === 'playing' && peerInfo.timeUpdatedAt > 0) {
          const elapsed = Math.min(3.0, Math.max(0, (Date.now() - peerInfo.timeUpdatedAt) / 1000));
          return peerInfo.time + elapsed;
        }
        return peerInfo.time;
      }

      function getPendingSyncLiveTime() {
        if (!pendingInitSync) return 0;
        const base = typeof pendingInitSync.time === 'number' ? pendingInitSync.time : 0;
        if (pendingInitSync.state === 'playing' && pendingInitSync.receivedAt > 0) {
          const elapsed = Math.max(0, (Date.now() - pendingInitSync.receivedAt) / 1000);
          return base + elapsed;
        }
        return base;
      }

      function normalizePlayerState(rawState) {
        if (!rawState || typeof rawState !== 'string') return null;

        if (s === 'paused' || s === 'pause' || s === 'stopped' || s === 'completed' || s === 'ended') {

      function setConnectionStatus(label, mode) {

      function getStateDisplayInfo(stateCode) {

      // Определяем, кто сейчас является нашим ориентиром для синхронизации

      // Синхронизировать свой плеер к конкретному участнику

      // --- Парсинг ссылок Rutube и VK Видео ---
      function parseRutubeToEmbed(rawInput) {
        if (!rawInput) return null;
        const input = rawInput.trim();
        const regex = /rutube\.ru\/(?:video\/(?:private\/)?|play\/embed\/|shorts\/)([a-zA-Z0-9_-]{16,64})/i;
        const match = input.match(regex);

        let videoId = match ? match[1] : null;
        let privateKey = null;

        try {
          const parsedUrl = new URL(input);
          if (parsedUrl.searchParams.has('p')) {
            privateKey = parsedUrl.searchParams.get('p');
          }
        } catch (_) {
          if (!videoId && /^[a-f0-9]{32}$/i.test(input)) {
            videoId = input;
          }
        }

        if (!videoId) return null;
        let embedUrl = `https://rutube.ru/play/embed/${videoId}`;
        if (privateKey) {
          embedUrl += `?p=${encodeURIComponent(privateKey)}`;
        }
        return embedUrl;
      }

      function parseVkToEmbed(rawInput) {
        if (!rawInput) return null;
        const input = rawInput.trim().replace(/&amp;/g, '&');

        const extMatch = input.match(/(https?:\/\/[^\s"'<>]*(?:vk\.com|vk\.ru|vkvideo\.ru)[^\s"'<>]*\/video_ext\.php\?[^\s"'<>]+)/i);
        if (extMatch) {
          try {
            const parsed = new URL(extMatch[1]);
            parsed.searchParams.set('js_api', '1');
            if (!parsed.searchParams.has('hd')) parsed.searchParams.set('hd', '2');
            return parsed.toString();
          } catch (_) {}
        }

        const relMatch = input.match(/video_ext\.php\?([^\s"'<>]+)/i);
        if (relMatch) {
          const q = new URLSearchParams(relMatch[1]);
          const oid = q.get('oid');
          const id = q.get('id');
          if (oid && id) {
            let u = `https://vkvideo.ru/video_ext.php?oid=${encodeURIComponent(oid)}&id=${encodeURIComponent(id)}`;
            if (q.get('hash')) u += `&hash=${encodeURIComponent(q.get('hash'))}`;
            return u + '&hd=2&js_api=1';
          }
        }

        const hostMatch = input.match(/https?:\/\/([a-zA-Z0-9\-_.]*(?:vk\.com|vk\.ru|vkvideo\.ru))/i);
        const host = hostMatch ? hostMatch[1] : 'vkvideo.ru';

        const vidMatch = input.match(/(?:video|clip)(-?\d+)_(\d+)/i);
        if (vidMatch) {
          const oid = vidMatch[1];
          const id = vidMatch[2];
          let hash = null;
          try {
            const parsedUrl = new URL(input);
            hash = parsedUrl.searchParams.get('hash') || parsedUrl.searchParams.get('list_hash');
          } catch (_) {}

          let u = `https://${host}/video_ext.php?oid=${encodeURIComponent(oid)}&id=${encodeURIComponent(id)}`;
          if (hash) u += `&hash=${encodeURIComponent(hash)}`;
          return u + '&hd=2&js_api=1';
        }

        return null;
      }

      function parseVideoUrl(rawInput) {
        return parseRutubeToEmbed(rawInput) || parseVkToEmbed(rawInput);
      }

      function getProviderFromEmbed(embedUrl) {
        return /(?:vk\.com|vk\.ru|vkvideo\.ru|video_ext\.php)/i.test(embedUrl || '') ? 'vk' : 'rutube';
      }

      // --- Интеграция VK Video Player API и postMessage моста ---
      let vkApiPromise = null;

      function loadScriptOnce(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => {
            s.remove();
            reject(new Error(`Не удалось загрузить ${src}`));
          };
          document.head.appendChild(s);
        });
      }

      function ensureVkApi() {
        if (window.VK && typeof window.VK.VideoPlayer === 'function') return Promise.resolve();
        if (vkApiPromise) return vkApiPromise;
        vkApiPromise = loadScriptOnce('https://vk.com/js/api/videoplayer.js')
          .catch(() => loadScriptOnce('https://vk.ru/js/api/videoplayer.js'))
          .catch(() => {
            vkApiPromise = null;
          });
        return vkApiPromise;
      }

      function teardownVkPlayer() {
        if (vkInitTimer) {
          clearInterval(vkInitTimer);
          vkInitTimer = null;
        }
        vkBridgeReady = false;
        if (vkPlayer && typeof vkPlayer.destroy === 'function') {
          try {
            vkPlayer.destroy();
          } catch (_) {}
        }
        vkPlayer = null;
      }

      function sendVkInitMessage(iframe) {
        if (!iframe || !iframe.contentWindow) return;
        try {
          iframe.contentWindow.postMessage({ method: 'init' }, '*');
        } catch (_) {}
      }

      function setupVkIframeBridge(iframe) {
        vkBridgeReady = false;
        let attempts = 0;

        const onIframeLoaded = () => {
          if (iframe !== playerIframe || currentProvider !== 'vk') return;
          sendVkInitMessage(iframe);

          ensureVkApi().then(() => {
            if (iframe !== playerIframe || currentProvider !== 'vk') return;
            if (window.VK && typeof window.VK.VideoPlayer === 'function' && !vkPlayer) {
              try {
                vkPlayer = window.VK.VideoPlayer(iframe);
              } catch (_) {}
            }
          });
        };

        iframe.addEventListener('load', onIframeLoaded);

        // Повторяем отправку { method: 'init' }, пока iframe VK не ответит первым событием
        if (vkInitTimer) clearInterval(vkInitTimer);
        vkInitTimer = setInterval(() => {
          if (iframe !== playerIframe || currentProvider !== 'vk' || vkBridgeReady || attempts > 20) {
            clearInterval(vkInitTimer);
            vkInitTimer = null;
            return;
          }
          attempts++;
          sendVkInitMessage(iframe);
        }, 450);
      }

      function mountPlayerIframe(embedUrl) {
        teardownVkPlayer();
        const provider = getProviderFromEmbed(embedUrl);
        const fresh = document.createElement('iframe');
        fresh.id = 'videoPlayer';
        fresh.setAttribute(
          'allow',
          'autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock'
        );
        fresh.setAttribute('allowfullscreen', '');
        fresh.setAttribute('frameborder', '0');
        fresh.src = embedUrl;
        playerIframe.replaceWith(fresh);
        playerIframe = fresh;
        currentProvider = provider;
        if (provider === 'vk') {
          setupVkIframeBridge(fresh);
        }
      }

      // --- Унифицированные команды плеера (Rutube и VK Видео) ---
      function playerCommand(cmd, arg) {
        if (!playerIframe || !currentEmbedUrl) return;

        if (currentProvider === 'vk') {
          // 1. Отправка напрямую через postMessage в iframe VK (не блокируется очередью uninited)
          if (playerIframe.contentWindow) {
            try {
              if (!vkBridgeReady) {
                playerIframe.contentWindow.postMessage({ method: 'init' }, '*');
              }
              let m = null;
              if (cmd === 'play') m = { method: 'play' };
              else if (cmd === 'pause') m = { method: 'pause' };
              else if (cmd === 'seek') m = { method: 'seek', time: arg };
              if (m) {
                playerIframe.contentWindow.postMessage(m, '*');
              }
            } catch (_) {}
          }
          // 2. Дублируем через объект VK.VideoPlayer, если он инициализирован
          if (vkPlayer) {
            try {
              if (cmd === 'play') vkPlayer.play();
              else if (cmd === 'pause') vkPlayer.pause();
              else if (cmd === 'seek') vkPlayer.seek(arg);
            } catch (_) {}
          }
          return;
        }

        // Rutube postMessage
        if (!playerIframe.contentWindow) return;
        let message = null;
        if (cmd === 'play') message = { type: 'player:play', data: {} };
        else if (cmd === 'pause') message = { type: 'player:pause', data: {} };
        else if (cmd === 'seek') message = { type: 'player:setCurrentTime', data: { time: arg } };
        if (message) {
          try {
            playerIframe.contentWindow.postMessage(JSON.stringify(message), '*');
          } catch (_) {}
        }
      }

      function playPlayer() {
        clearPauseFollowup();
        playerCommand('play');
      }

      function pausePlayer() {
        playerCommand('pause');
      }

      function seekPlayer(seconds) {
        if (!hasVideoStartedOnce) return;
        const target = Math.max(0, Number(seconds) || 0);
        playerCommand('seek', target);
      }

      // --- Загрузка видео в плеер ---
      function loadEmbedVideo(embedUrl, options = {}) {
        const { isRemote = false, initialTime = 0, initialState = 'paused', forceReload = false } = options;
        if (!embedUrl) return;

        clearPauseFollowup();
        lockRemoteAction(800);

        if (roomId) {
          try {
            sessionStorage.setItem('wp_video_' + roomId, embedUrl);
          } catch (_) {}
        }

        const isSameUrl = !forceReload && currentEmbedUrl === embedUrl && playerIframe && playerIframe.src === embedUrl;
        currentEmbedUrl = embedUrl;

        const targetState = normalizePlayerState(initialState) || 'paused';
        const targetTime = typeof initialTime === 'number' && !isNaN(initialTime) ? initialTime : 0;

        if (!isSameUrl) {
          hasVideoStartedOnce = false;
          localCurrentTime = 0;
          localState = 'paused';
          lastTimeUpdateWallClock = 0;
          isLocalBuffering = false;
          consecutiveDriftCount = 0;
          consecutiveForwardTicksWhilePaused = 0;

          playerPlaceholder.classList.add('hidden');
          mountPlayerIframe(embedUrl);
          videoUrlInput.value = embedUrl;
        }

        if (targetTime > 0.5 || targetState === 'playing') {
          pendingInitSync = {
            time: targetTime,
            state: targetState,
            receivedAt: Date.now()
          };
          updateTelemetryUI();
          addLog(
            `Видео загружено (целевое время комнаты: ${formatTimecode(targetTime)}). Нажмите Play в плеере для старта.`,
            'sync'
          );
        } else {
          pendingInitSync = null;
          updateTelemetryUI();
          addLog(isRemote ? 'Загружено новое видео в комнате' : 'Вы загрузили видео для всех участников', 'sync');
        }

        broadcastMyTelemetry();
        renderParticipantsUI();
      }

      // Применение отложенного состояния комнаты сразу после первого запуска плеера пользователем
      function applyPendingInitSyncOnFirstPlay() {
        if (!pendingInitSync) return;
        const syncState = pendingInitSync.state || 'playing';
        const syncTime = getPendingSyncLiveTime();
        pendingInitSync = null;

        lockRemoteAction(2200);
        isInitialSyncing = true;
        setTimeout(() => {
          isInitialSyncing = false;
        }, 2500);

        setTimeout(() => {
          lockRemoteAction(1200);
          if (syncTime > 1.0) {
            seekPlayer(syncTime);
            localCurrentTime = syncTime;
            lastTimeUpdateWallClock = Date.now();
          }
          if (syncState === 'playing') {
            localState = 'playing';
            playPlayer();
          } else {
            localState = 'paused';
            pausePlayer();
            pauseFollowupTimer = setTimeout(() => {
              if (localState === 'paused') {
                lockRemoteAction(450);
                pausePlayer();
              }
            }, 260);
          }
          updateTelemetryUI();
          broadcastMyTelemetry();
          addLog(`Плеер синхронизирован с комнатой: ${formatTimecode(syncTime)} (${syncState === 'playing' ? 'Играет' : 'Пауза'})`, 'sync');
        }, 300);
      }

      // --- Применение входящей команды синхронизации ---
      function applyRemoteSyncCommand(payload) {
        const { action, time, embedUrl, force = false, senderName } = payload;
        const state = normalizePlayerState(payload.state) || payload.state;
        const actor = senderName || 'Участник';

        if (embedUrl && embedUrl !== currentEmbedUrl) {
          loadEmbedVideo(embedUrl, {
            isRemote: true,
            initialTime: typeof time === 'number' ? time : 0,
            initialState: state || 'paused'
          });
          return;
        }

        if (!hasVideoStartedOnce) {
          pendingInitSync = {
            time: typeof time === 'number' ? time : 0,
            state: state || 'paused',
            receivedAt: Date.now()
          };
          if (state === 'playing' && (!time || time < 1.5)) {
            lockRemoteAction(700);
            playPlayer();
          }
          updateTelemetryUI();
          return;
        }

        lastManualSyncAt = Date.now();
        consecutiveDriftCount = 0;
        consecutiveForwardTicksWhilePaused = 0;
        isLocalBuffering = false;
        clearPauseFollowup();
        lockRemoteAction(850);

        if (state === 'paused') {
          localState = 'paused';
          let didSeek = false;

          if (typeof time === 'number' && !isNaN(time)) {
            const diff = Math.abs(time - localCurrentTime);
            if (force || action === 'force-sync' || diff >= PAUSE_SYNC_THRESHOLD) {
              seekPlayer(time);
              localCurrentTime = time;
              lastTimeUpdateWallClock = Date.now();
              didSeek = true;
            }
          }

          pausePlayer();
          if (didSeek) {
            pauseFollowupTimer = setTimeout(() => {
              if (localState === 'paused') {
                lockRemoteAction(450);
                pausePlayer();
              }
            }, 250);
          }
        } else if (state === 'playing') {
          localState = 'playing';
          let didSeek = false;

          if (typeof time === 'number' && !isNaN(time)) {
            const diff = Math.abs(time - getLiveCurrentTime());
            if (force || action === 'force-sync' || diff >= SYNC_THRESHOLD_SEC) {
              const targetTime = time + PLAY_SEEK_LEAD_SEC;
              seekPlayer(targetTime);
              localCurrentTime = targetTime;
              lastTimeUpdateWallClock = Date.now();
              didSeek = true;
            }
          }

          playPlayer();
          if (didSeek) {
            setTimeout(() => {
              if (localState === 'playing') {
                lockRemoteAction(450);
                playPlayer();
              }
            }, 200);
          }
        }

        updateTelemetryUI();
        broadcastMyTelemetry();
        renderParticipantsUI();

        const tc = formatTimecode(typeof time === 'number' ? time : localCurrentTime);
        if (action === 'force-sync') {
          addLog(`${actor} раздал время ${tc} (${state === 'playing' ? 'Играет' : 'Пауза'})`, 'sync');
        } else if (action === 'seek') {
          addLog(`${actor} перемотал на ${tc}`, 'sync');
        } else if (state === 'playing') {
          addLog(`${actor} включил воспроизведение на ${tc}`, 'sync');
        } else if (state === 'paused') {
          addLog(`${actor} поставил паузу на ${tc}`, 'sync');
        }
      }

      // --- Плавная авто-подстройка времени по выбранному ориентиру ---
      function checkAutoDriftSync() {
        if (!autoSyncCheckbox.checked) return;
        if (!currentEmbedUrl || !hasVideoStartedOnce || isInitialSyncing) return;
        if (isRemoteAction || isLocalBuffering) return;
        if (Date.now() - lastManualSyncAt < 3000) return;

        // Если мы Хост и режим ориентира 'auto', то ориентиром являемся мы сами
        if (isHost && syncTargetPeerId === 'auto') return;

        const targetPeer = getEffectiveTargetPeer();
        if (!targetPeer || targetPeer.embedUrl !== currentEmbedUrl) return;
        if (targetPeer.state !== 'playing' || localState !== 'playing') return;

        const targetLive = getPeerLiveTime(targetPeer);
        const myLive = getLiveCurrentTime();
        const drift = Math.abs(targetLive - myLive);

        if (drift >= DRIFT_BEACON_THRESHOLD && drift < 300) {
          consecutiveDriftCount++;
          if (consecutiveDriftCount >= 2) {
            consecutiveDriftCount = 0;
            const alignedTime = targetLive + PLAY_SEEK_LEAD_SEC;
            lockRemoteAction(800);
            seekPlayer(alignedTime);
            playPlayer();
            localCurrentTime = alignedTime;
            lastTimeUpdateWallClock = Date.now();
            updateTelemetryUI();
            addLog(`Авто-выравнивание с ${targetPeer.name}: ${formatTimecode(alignedTime)}`, 'sync');
          }
        } else {
          consecutiveDriftCount = 0;
        }
      }

      // --- Обработка postMessage событий от iframe плеера (Rutube и VK Видео) ---
      window.addEventListener('message', (event) => {
        if (!event.data) return;

        // 1. События VK Видео
        if (currentProvider === 'vk') {
          if (playerIframe && event.source && event.source !== playerIframe.contentWindow) {
            return;
          }
          let vkData = event.data;
          if (typeof vkData === 'string') {
            try {
              vkData = JSON.parse(vkData);
            } catch (_) {
              return;
            }
          }
          if (!vkData || typeof vkData !== 'object') return;

          vkBridgeReady = true;

          const ev = typeof vkData.event === 'string' ? vkData.event.toLowerCase() : '';
          if (ev === 'started' || ev === 'resumed' || ev === 'play' || ev === 'playing') {
            handlePlayerStateChange('playing');
          } else if (ev === 'paused' || ev === 'pause') {
            handlePlayerStateChange('paused');
          } else if (ev === 'ended') {
            handlePlayerStateChange('ended');
          } else if (ev === 'timeupdate' && typeof vkData.time === 'number') {
            handlePlayerTimeUpdate(vkData.time);
          } else if (ev === 'seeked' && typeof vkData.time === 'number') {
            handlePlayerTimeUpdate(vkData.time);
          }
          return;
        }

        // 2. События Rutube
        if (currentProvider === 'rutube') {
          let message;
          try {
            message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          } catch (_) {
            return;
          }

          if (!message || typeof message.type !== 'string') return;

          if (message.type === 'player:currentTime' && message.data && typeof message.data.time === 'number') {
            handlePlayerTimeUpdate(message.data.time);
            return;
          }

          if (message.type === 'player:changeState' && message.data) {
            handlePlayerStateChange(message.data.state);
          }
        }
      });

      // --- Общий обработчик текущего времени плеера ---
      function handlePlayerTimeUpdate(newTime) {
        if (typeof newTime !== 'number' || isNaN(newTime)) return;
        const now = Date.now();
        const prevTime = localCurrentTime;
        const elapsedWallSec = lastTimeUpdateWallClock > 0 ? (now - lastTimeUpdateWallClock) / 1000 : 0;

        localCurrentTime = newTime;
        lastTimeUpdateWallClock = now;

        if (!hasVideoStartedOnce && newTime > 0.1) {
          hasVideoStartedOnce = true;
          localState = 'playing';
          if (pendingInitSync) {
            applyPendingInitSyncOnFirstPlay();
            return;
          }
        }

        // Если плеер в режиме паузы, но время стабильно идет вперед само (более 3 тиков подряд вне удаленных команд),
        // значит пользователь снял видео с паузы, но iframe не прислал событие resumed:
        if (hasVideoStartedOnce && !isRemoteAction && elapsedWallSec > 0.05 && elapsedWallSec < 1.5) {
          const forwardStep = newTime - prevTime;
          if (forwardStep > 0.08 && forwardStep < 1.5) {
            if (localState === 'paused') {
              consecutiveForwardTicksWhilePaused++;
              if (consecutiveForwardTicksWhilePaused >= 3) {
                consecutiveForwardTicksWhilePaused = 0;
                handlePlayerStateChange('playing');
                return;
              }
            } else if (isLocalBuffering) {
              isLocalBuffering = false;
            }
          } else {
            consecutiveForwardTicksWhilePaused = 0;
          }
        }

        updateTelemetryUI();

        // Детектируем ручную перемотку ползунка пользователем внутри iframe
        if (hasVideoStartedOnce && !isRemoteAction && elapsedWallSec > 0 && elapsedWallSec < 5) {
          const expectedDelta = localState === 'playing' ? elapsedWallSec : 0;
          const actualDelta = Math.abs(newTime - prevTime);
          const drift = Math.abs(actualDelta - expectedDelta);

          if (drift >= 2.3) {
            if (seekBroadcastTimer) clearTimeout(seekBroadcastTimer);
            seekBroadcastTimer = setTimeout(() => {
              if (!isRemoteAction) {
                lastManualSyncAt = Date.now();
                const liveTime = getLiveCurrentTime();
                addLog(`Вы перемотали на ${formatTimecode(liveTime)}`, 'info');
                sendNetworkMessage({
                  type: 'sync',
                  action: 'seek',
                  state: localState,
                  time: liveTime,
                  embedUrl: currentEmbedUrl,
                  force: true,
                  senderName: myUserName
                });
                broadcastMyTelemetry();
              }
            }, 70);
          }
        }
      }

      // --- Общий обработчик смены статуса плеера ---
      function handlePlayerStateChange(rawStateInput) {
        const rawState = String(rawStateInput || '').trim().toLowerCase();

        if (rawState === 'buffering' || rawState === 'seeking') {
          if (hasVideoStartedOnce && !isRemoteAction && localState === 'playing' && !isLocalBuffering) {
            isLocalBuffering = true;
            bufferingStartedAt = Date.now();
            updateTelemetryUI();
          }
          return;
        }

        const normalizedState = normalizePlayerState(rawState);
        if (!normalizedState) return;

        consecutiveForwardTicksWhilePaused = 0;

        // Первый запуск плеера пользователем
        if (!hasVideoStartedOnce) {
          if (normalizedState === 'playing') {
            hasVideoStartedOnce = true;
            localState = 'playing';
            updateTelemetryUI();
            broadcastMyTelemetry();

            if (pendingInitSync) {
              applyPendingInitSyncOnFirstPlay();
              return;
            }
          } else {
            return;
          }
        }

        // Выход из буферизации
        if (isLocalBuffering && normalizedState === 'playing') {
          isLocalBuffering = false;
          updateTelemetryUI();
          return;
        }

        isLocalBuffering = false;

        // Если переключение вызвано входящей сетевой командой — не отправляем эхо обратно
        if (isRemoteAction) {
          return;
        }

        const now = Date.now();
        if (normalizedState === lastBroadcastedState && now - lastStateBroadcastAt < 250) {
          return;
        }

        localState = normalizedState;
        lastBroadcastedState = normalizedState;
        lastStateBroadcastAt = now;
        lastManualSyncAt = now;
        consecutiveDriftCount = 0;
        updateTelemetryUI();

        const syncTime = normalizedState === 'playing' ? getLiveCurrentTime() : localCurrentTime;
        const tc = formatTimecode(syncTime);

        sendNetworkMessage({
          type: 'sync',
          action: 'state-change',
          state: localState,
          time: syncTime,
          embedUrl: currentEmbedUrl,
          force: false,
          senderName: myUserName
        });

        broadcastMyTelemetry();
        renderParticipantsUI();

        if (normalizedState === 'playing') {
          addLog(`Вы включили воспроизведение на ${tc}`, 'info');
        } else {
          addLog(`Вы поставили паузу на ${tc}`, 'info');
        }
      }

      // =========================================================================
      // СЕТЬ: Гибридный транспорт PeerJS (WebRTC) + Пул WSS Relay
      // =========================================================================

      function stampMessage(data) {
        if (!data.msgId) {
          data.msgId = `${myClientId}-${++msgSeq}-${Date.now()}`;
        }
        if (!data.senderId) {
          data.senderId = myClientId;
        }
        if (!data.senderName) {
          data.senderName = myUserName;
        }
        return data;
      }

      function broadcastFromHostWebRTC(data, excludePeerId = null) {
        guestConnections.forEach((conn, peerId) => {
          if (peerId !== excludePeerId && conn.open) {
            try {
              conn.send(data);
            } catch (_) {}
          }
        });
      }

      function sendNetworkMessage(rawPayload) {
        const data = stampMessage({ ...rawPayload });
        seenMessageIds.add(data.msgId);

        if (isHost) {
          broadcastFromHostWebRTC(data);
        } else if (hostConnection && hostConnection.open) {
          try {
            hostConnection.send(data);
          } catch (_) {}
        }

        publishWssMessage(data);
      }

      function broadcastMyTelemetry() {
        const myEffectiveState = !currentEmbedUrl
          ? 'unstarted'
          : (!hasVideoStartedOnce ? 'unstarted' : (isLocalBuffering ? 'buffering' : localState));

        sendNetworkMessage({
          type: 'telemetry',
          name: myUserName,
          role: isHost ? 'host' : 'guest',
          state: myEffectiveState,
          time: getLiveCurrentTime(),
          embedUrl: currentEmbedUrl
        });
      }

      function markGuestConnected() {
        if (!guestConnectedToRoom) {
          guestConnectedToRoom = true;
          setConnectionStatus('Подключено', 'online');
          addLog('Успешно подключено к комнате', 'peer');
        }
      }

      function upsertPeerFromMessage(data, webrtcSenderPeerId) {
        if (!data.senderId || data.senderId === myClientId) return;
        const isNew = !activeRoomPeers.has(data.senderId);
        const existing = activeRoomPeers.get(data.senderId) || {
          id: data.senderId,
          name: data.senderName || data.name || `Участник ${data.senderId.slice(-4).toUpperCase()}`,
          role: data.role || 'guest',
          state: 'paused',
          time: 0,
          timeUpdatedAt: Date.now(),
          lastSeen: Date.now(),
          embedUrl: '',
          transport: webrtcSenderPeerId ? 'P2P' : 'Relay'
        };

        existing.lastSeen = Date.now();
        if (data.senderName || data.name) {
          existing.name = data.senderName || data.name;
        }
        if (data.role) {
          existing.role = data.role;
        }
        if (webrtcSenderPeerId) {
          existing.transport = 'P2P';
        }
        if (typeof data.time === 'number' && !isNaN(data.time)) {
          existing.time = data.time;
          existing.timeUpdatedAt = Date.now();
        }
        if (data.state) {
          existing.state = data.state;
        }
        if (data.embedUrl) {
          existing.embedUrl = data.embedUrl;
        }

        activeRoomPeers.set(data.senderId, existing);

        if (isNew) {
          addLog(`Подключился участник: ${existing.name}`, 'peer');
          renderParticipantsUI();
        }
      }

      function handleIncomingData(data, webrtcSenderPeerId = null) {
        if (!data || typeof data.type !== 'string') return;
        if (data.senderId === myClientId) return;

        if (data.msgId) {
          if (seenMessageIds.has(data.msgId)) return;
          seenMessageIds.add(data.msgId);
          if (seenMessageIds.size > 900) {
            const firstKey = seenMessageIds.values().next().value;
            seenMessageIds.delete(firstKey);
          }
        }

        upsertPeerFromMessage(data, webrtcSenderPeerId);

        if (!isHost && !guestConnectedToRoom) {
          markGuestConnected();
        }

        // Двусторонний мост Хоста между WebRTC и WSS
        if (isHost) {
          if (
            data.type === 'sync' ||
            data.type === 'load-video' ||
            data.type === 'telemetry' ||
            data.type === 'request-beacon' ||
            data.type === 'presence'
          ) {
            if (webrtcSenderPeerId) {
              broadcastFromHostWebRTC(data, webrtcSenderPeerId);
              publishWssMessage(data);
            } else {
              broadcastFromHostWebRTC(data);
            }
          }
        }

        if (data.type === 'telemetry') {
          checkAutoDriftSync();
          return;
        }

        if (data.type === 'presence') {
          if (data.action === 'leave' && data.senderId) {
            const peerObj = activeRoomPeers.get(data.senderId);
            const leftName = peerObj ? peerObj.name : data.senderId.slice(0, 6);
            activeRoomPeers.delete(data.senderId);
            renderParticipantsUI();
            addLog(`${leftName} покинул комнату`, 'warn');
            return;
          }

          if (data.action === 'join' || data.action === 'request-state') {
            broadcastMyTelemetry();
            if (currentEmbedUrl) {
              sendNetworkMessage({
                type: 'welcome',
                targetId: data.senderId,
                role: isHost ? 'host' : 'guest',
                embedUrl: currentEmbedUrl,
                time: getLiveCurrentTime(),
                state: localState
              });
            }
          }
          return;
        }

        if (data.type === 'request-beacon') {
          broadcastMyTelemetry();
          if (currentEmbedUrl && !isLocalBuffering) {
            sendNetworkMessage({
              type: 'welcome',
              role: isHost ? 'host' : 'guest',
              embedUrl: currentEmbedUrl,
              time: getLiveCurrentTime(),
              state: localState,
              urgent: true
            });
          }
          return;
        }

        if (data.type === 'welcome') {
          if (!isHost) {
            markGuestConnected();
          }
          if (data.embedUrl) {
            if (data.embedUrl !== currentEmbedUrl) {
              loadEmbedVideo(data.embedUrl, {
                isRemote: true,
                initialTime: data.time || 0,
                initialState: data.state || 'paused'
              });
            } else if (!hasVideoStartedOnce && (data.time > 0.5 || data.state === 'playing')) {
              pendingInitSync = {
                time: data.time || 0,
                state: normalizePlayerState(data.state) || 'paused',
                receivedAt: Date.now()
              };
              updateTelemetryUI();
            } else if (hasVideoStartedOnce && typeof data.time === 'number' && data.urgent) {
              applyRemoteSyncCommand({
                action: 'force-sync',
                time: data.time,
                state: data.state || 'paused',
                embedUrl: data.embedUrl,
                force: true,
                senderName: data.senderName
              });
            }
          }
          return;
        }

        if (data.type === 'load-video' && data.embedUrl) {
          loadEmbedVideo(data.embedUrl, {
            isRemote: true,
            initialTime: data.time || 0,
            initialState: data.state || 'paused'
          });
          return;
        }

        if (data.type === 'sync') {
          applyRemoteSyncCommand(data);
        }
      }

      // --- Инициализация сети ---
      function initPeerNetwork() {
        if (isHost) {
          setConnectionStatus('Хост комнаты', 'online');
          addLog(`Комната ${roomId} активна. Вы — Хост.`, 'peer');
        } else {
          setConnectionStatus('Подключение...', 'waiting');
          addLog(`Подключение к комнате ${roomId}...`, 'info');
        }

        startPeerInstance();
        initWssPool();
        renderParticipantsUI();

        // Повторяем рукопожатие при входе
        let handshakeAttempts = 0;
        const joinHandshakeInterval = setInterval(() => {
          handshakeAttempts++;
          if ((currentEmbedUrl && hasVideoStartedOnce) || handshakeAttempts > 10) {
            clearInterval(joinHandshakeInterval);
            return;
          }
          sendNetworkMessage({
            type: 'presence',
            action: currentEmbedUrl ? 'join' : 'request-state',
            role: isHost ? 'host' : 'guest'
          });
        }, 2200);

        // Регулярная рассылка телеметрии своего времени всем участникам (каждые 1.8 сек)
        setInterval(() => {
          broadcastMyTelemetry();
        }, 1800);

        // Локальное плавное обновление UI таймкодов и таблицы участников (каждые 500 мс)
        setInterval(() => {
          updateTelemetryUI();
          renderParticipantsUI();
        }, 500);

        // Фоновый контроль живучести WebRTC соединения у гостя
        setInterval(() => {
          if (!isHost && (!hostConnection || !hostConnection.open)) {
            if (peer && !peer.destroyed && peer.open) {
              connectToHostWebRTC(roomId);
            }
          }
        }, 8000);

        // Фоновый контроль живучести WSS-пула брокеров
        setInterval(() => {
          WSS_BROKERS.forEach((url) => {
            const entry = wssPool.get(url);
            if (!entry || (!entry.connected && (!entry.socket || entry.socket.readyState === WebSocket.CLOSED))) {
              connectSingleWssBroker(url);
            }
          });
        }, 12000);

        window.addEventListener('beforeunload', () => {
          sendNetworkMessage({
            type: 'presence',
            action: 'leave'
          });
        });
      }

      function startPeerInstance() {
        if (peer) {
          try {
            peer.destroy();
          } catch (_) {}
        }

        peer = isHost ? new Peer(roomId, PEERJS_CONFIG) : new Peer(undefined, PEERJS_CONFIG);

        peer.on('open', () => {
          if (isHost) {
            setConnectionStatus('Хост комнаты', 'online');
          } else {
            connectToHostWebRTC(roomId);
          }
        });

        peer.on('connection', (conn) => {
          if (!isHost) return;

          conn.on('open', () => {
            guestConnections.set(conn.peer, conn);
            conn.send(stampMessage({
              type: 'welcome',
              role: 'host',
              embedUrl: currentEmbedUrl,
              time: getLiveCurrentTime(),
              state: localState
            }));
            broadcastMyTelemetry();
          });

          conn.on('data', (data) => {
            handleIncomingData(data, conn.peer);
          });

          conn.on('close', () => {
            guestConnections.delete(conn.peer);
          });

          conn.on('error', () => {
            guestConnections.delete(conn.peer);
          });
        });

        peer.on('disconnected', () => {
          if (peer && !peer.destroyed) {
            try {
              peer.reconnect();
            } catch (_) {}
          }
        });

        peer.on('error', (err) => {
          const errType = err && err.type ? err.type : '';

          if (isHost && errType === 'unavailable-id') {
            setTimeout(() => startPeerInstance(), 2500);
            return;
          }

          if (!isHost) {
            if (errType === 'peer-unavailable' || errType === 'network' || errType === 'webrtc') {
              scheduleWebRtcReconnect(roomId);
              return;
            }
            if (errType === 'server-error' || errType === 'socket-error' || errType === 'socket-closed') {
              setTimeout(() => startPeerInstance(), 3500);
            }
          }
        });
      }

      function scheduleWebRtcReconnect(targetRoomId) {
        if (isHost) return;
        clearTimeout(peerRetryTimer);
        peerRetryTimer = setTimeout(() => {
          if (!hostConnection || !hostConnection.open) {
            connectToHostWebRTC(targetRoomId);
          }
        }, 3500);
      }

      function connectToHostWebRTC(targetRoomId) {
        if (!peer || peer.destroyed || !peer.open) return;
        if (hostConnection && hostConnection.open) return;

        try {
          hostConnection = peer.connect(targetRoomId, {
            reliable: true,
            serialization: 'json'
          });
        } catch (_) {
          scheduleWebRtcReconnect(targetRoomId);
          return;
        }

        if (!hostConnection) {
          scheduleWebRtcReconnect(targetRoomId);
          return;
        }

        hostConnection.on('open', () => {
          markGuestConnected();
          hostConnection.send(stampMessage({
            type: 'presence',
            action: 'join',
            role: 'guest'
          }));
          broadcastMyTelemetry();
        });

        hostConnection.on('data', (data) => {
          handleIncomingData(data);
        });

        hostConnection.on('close', () => {
          hostConnection = null;
          if (!hasAnyOpenWss()) {
            guestConnectedToRoom = false;
            setConnectionStatus('Переподключение...', 'waiting');
          }
          scheduleWebRtcReconnect(targetRoomId);
        });

        hostConnection.on('error', () => {
          hostConnection = null;
          scheduleWebRtcReconnect(targetRoomId);
        });
      }

      // --- Параллельный пул MQTT 3.1.1 over WSS ---
      function mqttEncodeLength(len) {
        const bytes = [];
        do {
          let b = len % 128;
          len = Math.floor(len / 128);
          if (len > 0) b |= 128;
          bytes.push(b);
        } while (len > 0);
        return bytes;
      }

      function mqttEncodeString(str) {
        const utf8 = textEncoder.encode(str);
        return [(utf8.length >> 8) & 0xff, utf8.length & 0xff, ...utf8];
      }

      function mqttBuildConnectPacket(clientId) {
        const varHeader = [0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c];
        const body = [...varHeader, ...mqttEncodeString(clientId)];
        return new Uint8Array([0x10, ...mqttEncodeLength(body.length), ...body]);
      }

      function mqttBuildSubscribePacket(topic) {
        const body = [0x00, 0x01, ...mqttEncodeString(topic), 0x00];
        return new Uint8Array([0x82, ...mqttEncodeLength(body.length), ...body]);
      }

      function mqttBuildPublishPacket(topic, payloadStr) {
        const topicBytes = mqttEncodeString(topic);
        const msgBytes = textEncoder.encode(payloadStr);
        const remLen = mqttEncodeLength(topicBytes.length + msgBytes.length);
        const packet = new Uint8Array(1 + remLen.length + topicBytes.length + msgBytes.length);
        packet[0] = 0x30;
        packet.set(remLen, 1);
        packet.set(topicBytes, 1 + remLen.length);
        packet.set(msgBytes, 1 + remLen.length + topicBytes.length);
        return packet;
      }

      function publishWssMessage(data) {
        let packet = null;
        wssPool.forEach((entry) => {
          if (entry.connected && entry.socket && entry.socket.readyState === WebSocket.OPEN) {
            try {
              if (!packet) {
                packet = mqttBuildPublishPacket(roomTopic, JSON.stringify(data));
              }
              entry.socket.send(packet);
            } catch (_) {}
          }
        });
      }

      function initWssPool() {
        WSS_BROKERS.forEach((brokerUrl) => {
          connectSingleWssBroker(brokerUrl);
        });
      }

      function connectSingleWssBroker(brokerUrl) {
        const existing = wssPool.get(brokerUrl);
        if (existing) {
          if (existing.pingTimer) {
            clearInterval(existing.pingTimer);
            existing.pingTimer = null;
          }
          if (existing.socket && (existing.socket.readyState === WebSocket.OPEN || existing.socket.readyState === WebSocket.CONNECTING)) {
            try {
              existing.socket.close();
            } catch (_) {}
          }
        }

        let ws;
        try {
          ws = new WebSocket(brokerUrl, 'mqtt');
          ws.binaryType = 'arraybuffer';
        } catch (_) {
          setTimeout(() => connectSingleWssBroker(brokerUrl), 4000);
          return;
        }

        const state = {
          socket: ws,
          connected: false,
          pingTimer: null
        };
        wssPool.set(brokerUrl, state);

        const connectTimeout = setTimeout(() => {
          if (!state.connected) {
            try {
              ws.close();
            } catch (_) {}
          }
        }, 7000);

        ws.onopen = () => {
          const mqttClientId = `wp_${myClientId}_${Math.random().toString(36).slice(2, 7)}`;
          try {
            ws.send(mqttBuildConnectPacket(mqttClientId));
          } catch (_) {}
        };

        ws.onmessage = (event) => {
          const buf = new Uint8Array(event.data);
          let offset = 0;

          while (offset < buf.length) {
            const packetType = buf[offset] >> 4;
            let multiplier = 1;
            let remLen = 0;
            let idx = offset + 1;
            let encodedByte;

            do {
              if (idx >= buf.length) return;
              encodedByte = buf[idx++];
              remLen += (encodedByte & 127) * multiplier;
              multiplier *= 128;
            } while ((encodedByte & 128) !== 0);

            const packetEnd = idx + remLen;
            if (packetEnd > buf.length) break;

            if (packetType === 2) {
              clearTimeout(connectTimeout);
              state.connected = true;
              try {
                ws.send(mqttBuildSubscribePacket(roomTopic));
              } catch (_) {}

              if (state.pingTimer) clearInterval(state.pingTimer);
              state.pingTimer = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) {
                  try {
                    ws.send(new Uint8Array([0xc0, 0x00]));
                  } catch (_) {}
                }
              }, 25000);

              if (!isHost && !guestConnectedToRoom) {
                markGuestConnected();
              }

              setTimeout(() => {
                sendNetworkMessage({
                  type: 'presence',
                  action: 'join',
                  role: isHost ? 'host' : 'guest'
                });
                broadcastMyTelemetry();
              }, 100);
            }

            if (packetType === 3) {
              const qos = (buf[offset] >> 1) & 0x03;
              const topicLen = (buf[idx] << 8) | buf[idx + 1];
              let payloadStart = idx + 2 + topicLen;
              if (qos > 0) payloadStart += 2;

              if (payloadStart <= packetEnd) {
                try {
                  const jsonStr = textDecoder.decode(buf.subarray(payloadStart, packetEnd));
                  const parsed = JSON.parse(jsonStr);
                  handleIncomingData(parsed);
                } catch (_) {}
              }
            }

            offset = packetEnd;
          }
        };

        ws.onerror = () => {};

        ws.onclose = () => {
          clearTimeout(connectTimeout);
          state.connected = false;
          if (state.pingTimer) {
            clearInterval(state.pingTimer);
            state.pingTimer = null;
          }
          setTimeout(() => connectSingleWssBroker(brokerUrl), 4000);
        };
      }

      // --- Обработчики кнопок интерфейса ---
      copyRoomBtn.addEventListener('click', async () => {
        const shareUrl = window.location.href;
        try {
          await navigator.clipboard.writeText(shareUrl);
          const originalText = copyRoomBtn.textContent;
          copyRoomBtn.textContent = 'Ссылка скопирована';
          addLog('Ссылка на комнату скопирована в буфер обмена', 'info');
          setTimeout(() => {
            copyRoomBtn.textContent = originalText;
          }, 2000);
        } catch (_) {
          window.prompt('Скопируйте ссылку на комнату:', shareUrl);
        }
      });

      newRoomBtn.addEventListener('click', () => {
        const freshRoomId = generateShortId('wp');
        sessionStorage.setItem('wp_host_room', freshRoomId);
        if (currentEmbedUrl) {
          try {
            sessionStorage.setItem('wp_video_' + freshRoomId, currentEmbedUrl);
          } catch (_) {}
        }
        window.location.href = `${window.location.pathname}?room=${encodeURIComponent(freshRoomId)}`;
      });

      function handleLoadVideoClick() {
        const rawUrl = videoUrlInput.value;
        const embedUrl = parseVideoUrl(rawUrl);

        if (!embedUrl) {
          addLog('Некорректная ссылка. Вставьте ссылку на Rutube, VK Видео или код iframe.', 'warn');
          videoUrlInput.focus();
          return;
        }

        loadEmbedVideo(embedUrl, { isRemote: false, initialTime: 0, initialState: 'paused', forceReload: true });

        sendNetworkMessage({
          type: 'load-video',
          embedUrl: embedUrl,
          time: 0,
          state: 'paused'
        });
      }

      loadVideoBtn.addEventListener('click', handleLoadVideoClick);

      videoUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleLoadVideoClick();
        }
      });

      // Кнопка Play / Пауза для всех прямо под плеером
      togglePlayPauseBtn.addEventListener('click', () => {
        if (!currentEmbedUrl) {
          addLog('Сначала загрузите видео', 'warn');
          return;
        }

        const nextState = (!hasVideoStartedOnce || localState === 'paused') ? 'playing' : 'paused';
        hasVideoStartedOnce = true;
        localState = nextState;
        lastBroadcastedState = nextState;
        lastStateBroadcastAt = Date.now();
        lastManualSyncAt = Date.now();
        lastTimeUpdateWallClock = Date.now();

        lockRemoteAction(750);
        if (nextState === 'playing') {
          playPlayer();
        } else {
          pausePlayer();
        }

        const liveTime = getLiveCurrentTime();
        updateTelemetryUI();
        sendNetworkMessage({
          type: 'sync',
          action: 'state-change',
          state: localState,
          time: liveTime,
          embedUrl: currentEmbedUrl,
          force: false,
          senderName: myUserName
        });
        broadcastMyTelemetry();
        renderParticipantsUI();
        addLog(`Вы переключили состояние на: ${nextState === 'playing' ? 'Воспроизведение' : 'Пауза'} (${formatTimecode(liveTime)})`, 'info');
      });

      function stepSeekBy(deltaSeconds) {
        if (!currentEmbedUrl || !hasVideoStartedOnce) {
          addLog('Сначала запустите видео в плеере', 'warn');
          return;
        }
        const target = Math.max(0, getLiveCurrentTime() + deltaSeconds);
        lockRemoteAction(750);
        seekPlayer(target);
        localCurrentTime = target;
        lastTimeUpdateWallClock = Date.now();
        lastManualSyncAt = Date.now();
        updateTelemetryUI();

        sendNetworkMessage({
          type: 'sync',
          action: 'seek',
          state: localState,
          time: target,
          embedUrl: currentEmbedUrl,
          force: true,
          senderName: myUserName
        });
        broadcastMyTelemetry();
        renderParticipantsUI();
        addLog(`Перемотка на ${formatTimecode(target)}`, 'info');
      }

      seekBackBtn.addEventListener('click', () => stepSeekBy(-10));
      seekForwardBtn.addEventListener('click', () => stepSeekBy(10));

      function forcePushMyTimeToAll() {
        if (!currentEmbedUrl) {
          addLog('Сначала загрузите видео для синхронизации', 'warn');
          return;
        }

        if (!hasVideoStartedOnce && pendingInitSync) {
          addLog('Сначала запустите свой плеер', 'warn');
          return;
        }

        lastManualSyncAt = Date.now();
        const liveTime = getLiveCurrentTime();
        const tc = formatTimecode(liveTime);
        addLog(`Вы раздали всем участникам своё время: ${tc} (${localState === 'playing' ? 'Играет' : 'Пауза'})`, 'sync');

        sendNetworkMessage({
          type: 'sync',
          action: 'force-sync',
          state: localState,
          time: liveTime,
          embedUrl: currentEmbedUrl,
          force: true,
          senderName: myUserName
        });
        broadcastMyTelemetry();
        renderParticipantsUI();
      }

      forceSyncBtn.addEventListener('click', forcePushMyTimeToAll);

      pullSyncBtn.addEventListener('click', () => {
        const targetPeer = getEffectiveTargetPeer();
        if (targetPeer && targetPeer.embedUrl) {
          syncMyPlayerToPeer(targetPeer, true);
          return;
        }

        if (!currentEmbedUrl) {
          addLog('Запрос текущего видео у комнаты...', 'info');
          sendNetworkMessage({
            type: 'presence',
            action: 'request-state',
            role: isHost ? 'host' : 'guest'
          });
          return;
        }

        addLog('Запрос актуального времени у участников комнаты...', 'info');
        sendNetworkMessage({
          type: 'request-beacon',
          embedUrl: currentEmbedUrl
        });
      });

      // Восстанавливаем видео из кэша комнаты в sessionStorage
      const cachedVideoForRoom = (function () {
        try {
          return sessionStorage.getItem('wp_video_' + roomId);
        } catch (_) {
          return null;
        }
      })();
      if (cachedVideoForRoom) {
        loadEmbedVideo(cachedVideoForRoom, { isRemote: true, initialTime: 0, initialState: 'paused' });
      }

      initPeerNetwork();
    })();
  </script>
</body>
