<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutube Watch Party — Синхронный просмотр</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-secondary: #131822;
      --bg-tertiary: #1c2331;
      --border-color: #263042;
      --text-primary: #f0f4f8;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #00a8e8;
      --accent-hover: #0090c7;
      --accent-glow: rgba(0, 168, 232, 0.2);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Верхняя панель */
    .top-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-and-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .status-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      transition: background-color 0.25s ease;
    }

    .status-indicator.online {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-indicator.error {
      background: var(--danger);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .url-bar {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .input-url {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-url::placeholder {
      color: var(--text-muted);
    }

    .input-url:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: #252f42;
      border-color: #38465f;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-sync {
      background: rgba(0, 168, 232, 0.14);
      border-color: rgba(0, 168, 232, 0.4);
      color: #5ce1e6;
    }

    .btn-sync:hover:not(:disabled) {
      background: rgba(0, 168, 232, 0.24);
      border-color: var(--accent);
    }

    /* Основная часть: Плеер 16:9 */
    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #05070a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .player-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: var(--text-secondary);
      gap: 10px;
      pointer-events: none;
    }

    .player-placeholder.hidden {
      display: none;
    }

    .player-placeholder-icon {
      font-size: 2.5rem;
      opacity: 0.7;
    }

    .player-placeholder-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .player-placeholder-sub {
      font-size: 0.86rem;
      color: var(--text-muted);
      max-width: 460px;
    }

    /* Нижняя панель */
    .bottom-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-telemetry {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .telemetry-pill {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .log-container {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      height: 150px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      line-height: 1.4;
      word-break: break-word;
    }

    .log-time {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-msg {
      color: var(--text-secondary);
    }

    .log-entry.info .log-msg {
      color: var(--text-primary);
    }

    .log-entry.sync .log-msg {
      color: #5ce1e6;
    }

    .log-entry.peer .log-msg {
      color: #34d399;
    }

    .log-entry.warn .log-msg {
      color: #fbbf24;
    }

    @media (max-width: 640px) {
      .app-container {
        padding: 10px;
        gap: 12px;
      }

      .url-bar {
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Верхняя панель -->
    <header class="top-panel">
      <div class="top-row">
        <div class="brand-and-status">
          <div class="brand">
            <span class="brand-dot"></span>
            <span>Rutube Watch Party</span>
          </div>
          <div class="status-badges">
            <div class="badge" id="connectionBadge">
              <span class="status-indicator" id="statusDot"></span>
              <span id="statusText">Ожидание...</span>
            </div>
            <div class="badge" title="Количество подключенных друзей">
              <span>Пиров:</span>
              <strong id="peerCount">0</strong>
            </div>
          </div>
        </div>

        <div class="top-actions">
          <button class="btn" id="copyRoomBtn" type="button">
            📋 Скопировать ссылку на комнату
          </button>
          <button class="btn" id="newRoomBtn" type="button" title="Создать новую комнату как Хост">
            ➕ Новая комната
          </button>
        </div>
      </div>

      <div class="url-bar">
        <input
          type="text"
          id="videoUrlInput"
          class="input-url"
          placeholder="Вставьте ссылку на видео Rutube (например, https://rutube.ru/video/c6582a09.../)"
          autocomplete="off"
        />
        <button class="btn btn-primary" id="loadVideoBtn" type="button">
          ▶ Загрузить для всех
        </button>
      </div>
    </header>

    <!-- Основная часть: Адаптивный плеер 16:9 -->
    <main class="player-wrapper">
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="player-placeholder-icon">🎬</div>
        <div class="player-placeholder-title">Видео ещё не выбрано</div>
        <div class="player-placeholder-sub">
          Вставьте ссылку на ролик с Rutube в поле выше и нажмите «Загрузить для всех», чтобы начать синхронный просмотр.
        </div>
      </div>
      <iframe
        id="rutubePlayer"
        src="about:blank"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write"
        allowfullscreen
        webkitAllowFullScreen
        mozallowfullscreen
      ></iframe>
    </main>

    <!-- Нижняя панель -->
    <footer class="bottom-panel">
      <div class="controls-row">
        <button class="btn btn-sync" id="forceSyncBtn" type="button">
          ⚡ Синхронизировать всех ко мне
        </button>

        <div class="player-telemetry">
          <span>Локальный плеер:</span>
          <span class="telemetry-pill" id="localStateLabel">Ожидание</span>
          <span class="telemetry-pill" id="localTimeLabel">00:00</span>
        </div>
      </div>

      <div class="log-container" id="eventLog" aria-live="polite"></div>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      // --- Константы синхронизации ---
      const SYNC_THRESHOLD_SEC = 1.5;      // Порог рассинхрона при проверке во время воспроизведения
      const PAUSE_SYNC_THRESHOLD = 0.25;   // При паузе форсируем точное выравнивание таймкода (от 0.25 сек)
      const REMOTE_LOCK_MS = 800;          // Защита от эхо-цикла (feedback loop)
      const PLAY_SEEK_LEAD_SEC = 0.65;     // Компенсация буферизации при перемотке во время игры
      const SENDER_START_HOLD_MS = 420;    // Микро-удержание стартующего плеера, чтобы пакет дошел до пиров и старт был одновременным

      // Конфигурация STUN + TURN серверов для обхода NAT и VPN в WebRTC (PeerJS)
      const PEERJS_CONFIG = {
        debug: 0,
        config: {
          iceCandidatePoolSize: 10,
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
            {
              urls: [
                'turn:openrelay.metered.ca:80',
                'turn:openrelay.metered.ca:443',
                'turn:openrelay.metered.ca:443?transport=tcp',
                'turns:openrelay.metered.ca:443?transport=tcp'
              ],
              username: 'openrelayproject',
              credential: 'openrelayproject'
            }
          ]
        }
      };

      // Параллельный пул WSS-брокеров (MQTT over WebSockets на портах 443/8084/8884),
      // обеспечивающий мгновенную доставку команд даже если VPN блокирует WebRTC/UDP
      const WSS_BROKERS = [
        'wss://mqtt.eclipseprojects.io:443/mqtt',
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];

      // --- DOM элементы ---
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const peerCountEl = document.getElementById('peerCount');
      const copyRoomBtn = document.getElementById('copyRoomBtn');
      const newRoomBtn = document.getElementById('newRoomBtn');
      const videoUrlInput = document.getElementById('videoUrlInput');
      const loadVideoBtn = document.getElementById('loadVideoBtn');
      const playerIframe = document.getElementById('rutubePlayer');
      const playerPlaceholder = document.getElementById('playerPlaceholder');
      const forceSyncBtn = document.getElementById('forceSyncBtn');
      const localStateLabel = document.getElementById('localStateLabel');
      const localTimeLabel = document.getElementById('localTimeLabel');
      const eventLog = document.getElementById('eventLog');

      // --- Состояние плеера и синхронизации ---
      let currentEmbedUrl = '';
      let localState = 'paused';           // 'playing' | 'paused'
      let localCurrentTime = 0;            // Последнее полученное время от плеера в секундах
      let lastTimeUpdateWallClock = 0;     // Wall-clock время последнего события currentTime (Date.now())
      let isRemoteAction = false;          // Флаг защиты от эхо-цикла
      let remoteActionTimer = null;
      let seekBroadcastTimer = null;
      let senderHoldTimer = null;          // Таймер микро-удержания при старте воспроизведения
      let pauseEnforceTimers = [];         // Таймеры повторного подтверждения паузы после перемотки
      let lastStateBroadcastAt = 0;
      let lastBroadcastedState = '';
      let pendingInitSync = null;          // Состояние для применения после загрузки iframe

      // --- Идентификация клиента и комнаты ---
      function generateShortId(prefix) {
        const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
        let id = prefix ? `${prefix}-` : '';
        for (let i = 0; i < 8; i++) {
          id += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return id;
      }

      let myClientId = sessionStorage.getItem('wp_client_id');
      if (!myClientId) {
        myClientId = generateShortId('u');
        sessionStorage.setItem('wp_client_id', myClientId);
      }

      const urlParams = new URLSearchParams(window.location.search);
      let roomId = urlParams.get('room');
      const savedHostRoom = sessionStorage.getItem('wp_host_room');

      let isHost = false;
      if (!roomId) {
        roomId = generateShortId('wp');
        sessionStorage.setItem('wp_host_room', roomId);
        isHost = true;
        const newUrl = `${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
        window.history.replaceState(null, '', newUrl);
      } else if (savedHostRoom === roomId) {
        isHost = true;
      }

      // --- Состояние сети (PeerJS + параллельный пул WSS) ---
      let peer = null;
      let hostConnection = null;           // Для гостя: WebRTC соединение с Хостом
      const guestConnections = new Map();  // Для Хоста: peerId -> DataConnection
      const activeRoomPeers = new Map();   // clientId -> timestamp последней активности
      const seenMessageIds = new Set();    // Дедупликация пакетов между WebRTC и WSS
      let msgSeq = 0;
      let guestConnectedToRoom = false;
      let peerRetryTimer = null;
      let peerRetryCount = 0;

      // Состояние параллельного пула WSS Relay
      const wssPool = new Map();           // brokerUrl -> { socket, connected, pingTimer }
      const roomTopic = `rutube-watch-party/v2/${roomId}`;
      const textEncoder = new TextEncoder();
      const textDecoder = new TextDecoder();

      // --- Вспомогательные функции ---
      function formatTimecode(seconds) {
        if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '00:00';
        const total = Math.floor(seconds);
        const hrs = Math.floor(total / 3600);
        const mins = Math.floor((total % 3600) / 60);
        const secs = total % 60;
        const mm = String(mins).padStart(2, '0');
        const ss = String(secs).padStart(2, '0');
        return hrs > 0 ? `${hrs}:${mm}:${ss}` : `${mm}:${ss}`;
      }

      // Вычисляет точное текущее время плеера с учетом миллисекунд, прошедших с последнего события currentTime
      function getLiveCurrentTime() {
        if (localState === 'playing' && lastTimeUpdateWallClock > 0) {
          const elapsedSec = (Date.now() - lastTimeUpdateWallClock) / 1000;
          if (elapsedSec > 0 && elapsedSec < 1.2) {
            return localCurrentTime + elapsedSec;
          }
        }
        return localCurrentTime;
      }

      // Нормализует названия статусов плеера Rutube ('pause' / 'paused' / 'stopped' -> 'paused', 'play' / 'playing' -> 'playing')
      function normalizePlayerState(rawState) {
        if (!rawState || typeof rawState !== 'string') return null;
        const s = rawState.trim().toLowerCase();
        if (s === 'playing' || s === 'play') return 'playing';
        if (s === 'paused' || s === 'pause' || s === 'stopped' || s === 'completed' || s === 'ended') {
          return 'paused';
        }
        return null;
      }

      function clearPauseEnforceTimers() {
        while (pauseEnforceTimers.length > 0) {
          clearTimeout(pauseEnforceTimers.pop());
        }
      }

      function clearSenderHoldTimer() {
        if (senderHoldTimer) {
          clearTimeout(senderHoldTimer);
          senderHoldTimer = null;
        }
      }

      // Микро-удержание локального плеера при нажатии Play / Force Sync,
      // чтобы за ~420 мс сетевой пакет дошел до друзей через VPN и оба плеера стартовали одновременно без форы у Хоста
      function holdLocalPlayerForCoordinatedStart(holdMs = SENDER_START_HOLD_MS) {
        clearSenderHoldTimer();
        clearPauseEnforceTimers();
        lockRemoteAction(holdMs + 550);
        sendCommandToPlayer('player:pause', {});
        senderHoldTimer = setTimeout(() => {
          senderHoldTimer = null;
          if (localState === 'playing') {
            lockRemoteAction(450);
            sendCommandToPlayer('player:play', {});
          }
        }, holdMs);
      }

      function addLog(message, type = 'info') {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = `[${timeStr}]`;

        const msgSpan = document.createElement('span');
        msgSpan.className = 'log-msg';
        msgSpan.textContent = message;

        entry.appendChild(timeSpan);
        entry.appendChild(msgSpan);
        eventLog.appendChild(entry);
        eventLog.scrollTop = eventLog.scrollHeight;
      }

      function updateTelemetryUI() {
        localStateLabel.textContent = localState === 'playing' ? '▶ Играет' : '⏸ Пауза';
        localTimeLabel.textContent = formatTimecode(localCurrentTime);
      }

      function setConnectionStatus(label, mode) {
        statusText.textContent = label;
        statusDot.className = 'status-indicator';
        if (mode === 'online') statusDot.classList.add('online');
        if (mode === 'error') statusDot.classList.add('error');
      }

      function refreshPeerCountUI() {
        const now = Date.now();
        activeRoomPeers.forEach((lastSeen, cid) => {
          if (now - lastSeen > 30000) {
            activeRoomPeers.delete(cid);
          }
        });
        const total = Math.max(activeRoomPeers.size, guestConnections.size);
        peerCountEl.textContent = String(total);
      }

      function hasAnyOpenWss() {
        for (const item of wssPool.values()) {
          if (item.connected) return true;
        }
        return false;
      }

      // --- Защита от эхо-цикла (feedback loop) ---
      function lockRemoteAction(durationMs = REMOTE_LOCK_MS) {
        isRemoteAction = true;
        if (remoteActionTimer) {
          clearTimeout(remoteActionTimer);
        }
        remoteActionTimer = setTimeout(() => {
          isRemoteAction = false;
        }, durationMs);
      }

      // --- Парсинг ссылки Rutube ---
      function parseRutubeToEmbed(rawInput) {
        if (!rawInput) return null;
        const input = rawInput.trim();

        const regex = /rutube\.ru\/(?:video\/(?:private\/)?|play\/embed\/|shorts\/)([a-zA-Z0-9_-]{16,64})/i;
        const match = input.match(regex);

        let videoId = match ? match[1] : null;
        let privateKey = null;

        try {
          const parsedUrl = new URL(input);
          if (parsedUrl.searchParams.has('p')) {
            privateKey = parsedUrl.searchParams.get('p');
          }
        } catch (_) {
          if (!videoId && /^[a-f0-9]{32}$/i.test(input)) {
            videoId = input;
          }
        }

        if (!videoId) return null;

        let embedUrl = `https://rutube.ru/play/embed/${videoId}`;
        if (privateKey) {
          embedUrl += `?p=${encodeURIComponent(privateKey)}`;
        }
        return embedUrl;
      }

      // --- Команды для Rutube Iframe API ---
      function sendCommandToPlayer(type, data = {}) {
        if (!playerIframe || !playerIframe.contentWindow || !currentEmbedUrl) return;
        const payload = JSON.stringify({ type, data });
        playerIframe.contentWindow.postMessage(payload, '*');
      }

      function playPlayer() {
        clearPauseEnforceTimers();
        sendCommandToPlayer('player:play', {});
      }

      function pausePlayer() {
        clearSenderHoldTimer();
        sendCommandToPlayer('player:pause', {});
      }

      function seekPlayer(seconds) {
        const target = Math.max(0, Number(seconds) || 0);
        sendCommandToPlayer('player:setCurrentTime', { time: target });
      }

      // --- Загрузка видео в плеер ---
      function loadEmbedVideo(embedUrl, options = {}) {
        const { isRemote = false, initialTime = 0, initialState = 'paused' } = options;
        if (!embedUrl) return;

        clearSenderHoldTimer();
        clearPauseEnforceTimers();
        lockRemoteAction(900);
        currentEmbedUrl = embedUrl;
        localCurrentTime = initialTime || 0;
        localState = normalizePlayerState(initialState) || 'paused';
        lastTimeUpdateWallClock = 0;

        playerPlaceholder.classList.add('hidden');
        if (playerIframe.src !== embedUrl) {
          playerIframe.src = embedUrl;
        }
        videoUrlInput.value = embedUrl;
        updateTelemetryUI();

        if (initialTime > 0 || localState === 'playing') {
          pendingInitSync = { time: initialTime, state: localState };
        } else {
          pendingInitSync = null;
        }

        addLog(
          isRemote
            ? `Загружено видео по сети: ${embedUrl}`
            : `Видео загружено для всех: ${embedUrl}`,
          'sync'
        );
      }

      // --- Применение входящей команды синхронизации ---
      function applyRemoteSyncCommand(payload) {
        const { action, time, embedUrl, force = false } = payload;
        const state = normalizePlayerState(payload.state) || payload.state;

        if (embedUrl && embedUrl !== currentEmbedUrl) {
          loadEmbedVideo(embedUrl, {
            isRemote: true,
            initialTime: typeof time === 'number' ? time : 0,
            initialState: state || 'paused'
          });
          return;
        }

        clearSenderHoldTimer();
        clearPauseEnforceTimers();
        lockRemoteAction(REMOTE_LOCK_MS);

        if (state === 'paused') {
          // При паузе ВСЕГДА форсируем синхронизацию таймкода (если разница >= 0.25 сек),
          // чтобы у всех участников видео встало на один и тот же кадр и предзагрузило буфер
          localState = 'paused';
          pausePlayer();

          if (typeof time === 'number' && !isNaN(time)) {
            const diff = Math.abs(time - localCurrentTime);
            if (force || diff >= PAUSE_SYNC_THRESHOLD) {
              seekPlayer(time);
              localCurrentTime = time;
              lastTimeUpdateWallClock = Date.now();
            }
          }

          // Повторно подтверждаем паузу, чтобы Rutube не продолжил играть после завершения seek
          lockRemoteAction(1000);
          pauseEnforceTimers.push(
            setTimeout(() => {
              if (localState === 'paused') pausePlayer();
            }, 140),
            setTimeout(() => {
              if (localState === 'paused') pausePlayer();
            }, 340)
          );
        } else if (state === 'playing') {
          localState = 'playing';
          let didSeek = false;

          if (typeof time === 'number' && !isNaN(time)) {
            const diff = Math.abs(time - getLiveCurrentTime());
            // Если время уже совпадает (например, старт с 00:00 или после общей паузы) —
            // НЕ вызываем seekPlayer, чтобы не сбрасывать буфер (Хост ждет нас через микро-удержание 420 мс).
            // Если же есть рассинхрон >= 1.5 сек или нажата принудительная синхронизация — перематываем с упреждением.
            if (force || diff >= SYNC_THRESHOLD_SEC) {
              const lead = action === 'force-sync' ? 0.35 : PLAY_SEEK_LEAD_SEC;
              const targetTime = time + lead;
              seekPlayer(targetTime);
              localCurrentTime = targetTime;
              lastTimeUpdateWallClock = Date.now();
              didSeek = true;
            }
          }

          playPlayer();
          if (didSeek) {
            setTimeout(() => {
              if (localState === 'playing') {
                lockRemoteAction(500);
                playPlayer();
              }
            }, 180);
          }
        }

        updateTelemetryUI();

        const tc = formatTimecode(typeof time === 'number' ? time : localCurrentTime);
        if (action === 'force-sync') {
          addLog(`Принудительная синхронизация: ${state === 'playing' ? 'Воспроизведение' : 'Пауза'} на ${tc}`, 'sync');
        } else if (action === 'seek') {
          addLog(`Друг перемотал на ${tc}`, 'sync');
        } else if (state === 'playing') {
          addLog(`Воспроизведение на ${tc}`, 'sync');
        } else if (state === 'paused') {
          addLog(`Пауза и синхронизация на ${tc}`, 'sync');
        }
      }

      // --- Обработка событий от Rutube Iframe через window.addEventListener('message') ---
      window.addEventListener('message', (event) => {
        if (!event.data) return;

        let message;
        try {
          message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        } catch (_) {
          return;
        }

        if (!message || typeof message.type !== 'string') return;

        if (
          pendingInitSync &&
          (message.type === 'player:ready' ||
            message.type === 'player:durationChange' ||
            message.type === 'player:currentTime')
        ) {
          const initData = pendingInitSync;
          pendingInitSync = null;
          setTimeout(() => {
            applyRemoteSyncCommand({
              action: 'force-sync',
              state: initData.state,
              time: initData.time,
              force: true
            });
          }, 350);
        }

        // 1. Текущее время плеера
        if (message.type === 'player:currentTime' && message.data && typeof message.data.time === 'number') {
          const newTime = message.data.time;
          const now = Date.now();
          const prevTime = localCurrentTime;
          const elapsedWallSec = lastTimeUpdateWallClock > 0 ? (now - lastTimeUpdateWallClock) / 1000 : 0;

          localCurrentTime = newTime;
          lastTimeUpdateWallClock = now;

          // Если время плавно идет вперед вне удаленной команды — плеер в режиме воспроизведения
          if (!isRemoteAction && elapsedWallSec > 0.05 && elapsedWallSec < 1.2) {
            const forwardStep = newTime - prevTime;
            if (forwardStep > 0.05 && forwardStep < 1.5 && localState !== 'playing') {
              localState = 'playing';
            }
          }

          updateTelemetryUI();

          // Детектируем ручную перемотку ползунка пользователем внутри iframe
          if (!isRemoteAction && elapsedWallSec > 0 && elapsedWallSec < 5) {
            const expectedDelta = localState === 'playing' ? elapsedWallSec : 0;
            const actualDelta = Math.abs(newTime - prevTime);
            const drift = Math.abs(actualDelta - expectedDelta);

            if (drift >= 2.2) {
              if (seekBroadcastTimer) clearTimeout(seekBroadcastTimer);
              seekBroadcastTimer = setTimeout(() => {
                if (!isRemoteAction) {
                  const liveTime = getLiveCurrentTime();
                  addLog(`Перемотка на ${formatTimecode(liveTime)}`, 'info');
                  sendNetworkMessage({
                    type: 'sync',
                    action: 'seek',
                    state: localState,
                    time: liveTime,
                    embedUrl: currentEmbedUrl,
                    force: true
                  });
                }
              }, 60);
            }
          }
          return;
        }

        // 2. Смена статуса плеера (Rutube присылает 'playing' или 'pause' / 'paused' в player:changeState)
        if (message.type === 'player:changeState' && message.data) {
          const normalizedState = normalizePlayerState(message.data.state);
          if (!normalizedState) {
            return;
          }

          // Если событие вызвано программным переключением (или микро-удержанием старта) — игнорируем
          if (isRemoteAction) {
            return;
          }

          const now = Date.now();
          if (normalizedState === lastBroadcastedState && now - lastStateBroadcastAt < 250) {
            return;
          }

          localState = normalizedState;
          lastBroadcastedState = normalizedState;
          lastStateBroadcastAt = now;
          updateTelemetryUI();

          const syncTime = normalizedState === 'playing' ? getLiveCurrentTime() : localCurrentTime;
          const tc = formatTimecode(syncTime);

          // Отправляем событие всем пирам в комнате
          sendNetworkMessage({
            type: 'sync',
            action: 'state-change',
            state: localState,
            time: syncTime,
            embedUrl: currentEmbedUrl,
            force: localState === 'paused'
          });

          if (normalizedState === 'playing') {
            addLog(`Вы включили воспроизведение на ${tc}`, 'info');
            // Если есть подключенные друзья — придерживаем локальный старт на 420 мс,
            // чтобы команда успела дойти по сети и видео пошло синхронно без забегания вперед
            if (activeRoomPeers.size > 0 || guestConnections.size > 0 || !isHost) {
              holdLocalPlayerForCoordinatedStart(SENDER_START_HOLD_MS);
            }
          } else {
            clearSenderHoldTimer();
            addLog(`Вы поставили паузу на ${tc} (синхронизация всех)`, 'info');
          }
        }
      });

      // =========================================================================
      // СЕТЬ: Гибридный транспорт PeerJS (WebRTC DataChannel) + Пул WSS Relay
      // =========================================================================

      function stampMessage(data) {
        if (!data.msgId) {
          data.msgId = `${myClientId}-${++msgSeq}-${Date.now()}`;
        }
        if (!data.senderId) {
          data.senderId = myClientId;
        }
        return data;
      }

      function broadcastFromHostWebRTC(data, excludePeerId = null) {
        guestConnections.forEach((conn, peerId) => {
          if (peerId !== excludePeerId && conn.open) {
            try {
              conn.send(data);
            } catch (_) {}
          }
        });
      }

      function sendNetworkMessage(rawPayload) {
        const data = stampMessage({ ...rawPayload });
        seenMessageIds.add(data.msgId);

        // 1. Отправка через PeerJS WebRTC DataChannel
        if (isHost) {
          broadcastFromHostWebRTC(data);
        } else if (hostConnection && hostConnection.open) {
          try {
            hostConnection.send(data);
          } catch (_) {}
        }

        // 2. Параллельная отправка во все открытые WSS-брокеры (гарантия прохождения через любые VPN)
        publishWssMessage(data);
      }

      function markGuestConnected() {
        if (!guestConnectedToRoom) {
          guestConnectedToRoom = true;
          setConnectionStatus('Подключено к комнате', 'online');
          addLog('Успешно подключено к комнате!', 'peer');
        }
      }

      function handleIncomingData(data, webrtcSenderPeerId = null) {
        if (!data || typeof data.type !== 'string') return;
        if (data.senderId === myClientId) return;

        // Дедупликация сообщений между WebRTC и WSS-пулом
        if (data.msgId) {
          if (seenMessageIds.has(data.msgId)) return;
          seenMessageIds.add(data.msgId);
          if (seenMessageIds.size > 800) {
            const firstKey = seenMessageIds.values().next().value;
            seenMessageIds.delete(firstKey);
          }
        }

        // Отслеживание присутствия участников
        if (data.senderId) {
          const isNewPeer = !activeRoomPeers.has(data.senderId);
          activeRoomPeers.set(data.senderId, Date.now());
          refreshPeerCountUI();

          if (isNewPeer) {
            addLog(`Друг подключился (${data.senderId.slice(0, 6)})`, 'peer');
          }
        }

        // Если мы Гость и получили любое сообщение от комнаты — значит связь с комнатой установлена
        if (!isHost && !guestConnectedToRoom) {
          markGuestConnected();
        }

        // Ретрансляция Хостом по WebRTC другим гостям
        if (isHost && webrtcSenderPeerId && (data.type === 'sync' || data.type === 'load-video')) {
          broadcastFromHostWebRTC(data, webrtcSenderPeerId);
        }

        // Обработка присутствия и рукопожатия комнаты
        if (data.type === 'presence') {
          if (data.action === 'leave' && data.senderId) {
            activeRoomPeers.delete(data.senderId);
            refreshPeerCountUI();
            addLog(`Друг отключился (${data.senderId.slice(0, 6)})`, 'warn');
            return;
          }

          if (data.action === 'join' || data.action === 'request-state') {
            if (isHost || currentEmbedUrl) {
              sendNetworkMessage({
                type: 'welcome',
                targetId: data.senderId,
                peerCount: Math.max(activeRoomPeers.size, guestConnections.size),
                embedUrl: currentEmbedUrl,
                time: getLiveCurrentTime(),
                state: localState
              });
            }
          }
          return;
        }

        if (data.type === 'welcome') {
          if (!isHost) {
            markGuestConnected();
          }
          if (typeof data.peerCount === 'number') {
            peerCountEl.textContent = String(Math.max(data.peerCount, activeRoomPeers.size));
          }
          if (data.embedUrl && data.embedUrl !== currentEmbedUrl) {
            loadEmbedVideo(data.embedUrl, {
              isRemote: true,
              initialTime: data.time || 0,
              initialState: data.state || 'paused'
            });
          }
          return;
        }

        if (data.type === 'load-video' && data.embedUrl) {
          loadEmbedVideo(data.embedUrl, {
            isRemote: true,
            initialTime: data.time || 0,
            initialState: data.state || 'paused'
          });
          return;
        }

        if (data.type === 'sync') {
          applyRemoteSyncCommand(data);
        }
      }

      // --- 1. Инициализация PeerJS (WebRTC) + WSS пула ---
      function initPeerNetwork() {
        if (isHost) {
          setConnectionStatus('Хост', 'online');
          addLog(`Комната создана (${roomId}). Вы — Хост.`, 'peer');
        } else {
          setConnectionStatus('Подключение...', 'waiting');
          addLog(`Подключение к комнате ${roomId}...`, 'info');
        }

        startPeerInstance();
        initWssPool();

        // Быстрый повтор рукопожатия для Гостя, пока он не получит ответ от комнаты
        const joinHandshakeInterval = setInterval(() => {
          if (isHost || guestConnectedToRoom) {
            clearInterval(joinHandshakeInterval);
            return;
          }
          sendNetworkMessage({
            type: 'presence',
            action: 'join',
            role: 'guest'
          });
        }, 2200);

        // Периодический heartbeat присутствия
        setInterval(() => {
          sendNetworkMessage({
            type: 'presence',
            action: 'heartbeat',
            role: isHost ? 'host' : 'guest'
          });
          refreshPeerCountUI();
        }, 8000);

        window.addEventListener('beforeunload', () => {
          sendNetworkMessage({
            type: 'presence',
            action: 'leave'
          });
        });
      }

      function startPeerInstance() {
        if (peer) {
          try {
            peer.destroy();
          } catch (_) {}
        }

        peer = isHost ? new Peer(roomId, PEERJS_CONFIG) : new Peer(undefined, PEERJS_CONFIG);

        peer.on('open', () => {
          if (isHost) {
            setConnectionStatus('Хост', 'online');
          } else {
            connectToHostWebRTC(roomId);
          }
        });

        peer.on('connection', (conn) => {
          if (!isHost) return;

          conn.on('open', () => {
            guestConnections.set(conn.peer, conn);
            refreshPeerCountUI();

            conn.send(stampMessage({
              type: 'welcome',
              peerCount: Math.max(activeRoomPeers.size, guestConnections.size),
              embedUrl: currentEmbedUrl,
              time: getLiveCurrentTime(),
              state: localState
            }));
          });

          conn.on('data', (data) => {
            handleIncomingData(data, conn.peer);
          });

          conn.on('close', () => {
            guestConnections.delete(conn.peer);
            refreshPeerCountUI();
          });

          conn.on('error', () => {
            guestConnections.delete(conn.peer);
            refreshPeerCountUI();
          });
        });

        peer.on('disconnected', () => {
          if (peer && !peer.destroyed) {
            try {
              peer.reconnect();
            } catch (_) {}
          }
        });

        peer.on('error', (err) => {
          const errType = err && err.type ? err.type : '';

          if (isHost && errType === 'unavailable-id') {
            setTimeout(() => startPeerInstance(), 2500);
            return;
          }

          if (!isHost && (errType === 'peer-unavailable' || errType === 'network' || errType === 'webrtc')) {
            if (!guestConnectedToRoom && peerRetryCount < 6) {
              peerRetryCount++;
              clearTimeout(peerRetryTimer);
              peerRetryTimer = setTimeout(() => connectToHostWebRTC(roomId), 3000);
            }
            return;
          }
        });
      }

      function connectToHostWebRTC(targetRoomId) {
        if (!peer || peer.destroyed || !peer.open) return;

        try {
          hostConnection = peer.connect(targetRoomId, {
            reliable: true,
            serialization: 'json'
          });
        } catch (_) {
          return;
        }

        if (!hostConnection) return;

        hostConnection.on('open', () => {
          markGuestConnected();
          hostConnection.send(stampMessage({
            type: 'presence',
            action: 'join',
            role: 'guest'
          }));
        });

        hostConnection.on('data', (data) => {
          handleIncomingData(data);
        });

        hostConnection.on('close', () => {
          if (!hasAnyOpenWss()) {
            guestConnectedToRoom = false;
            setConnectionStatus('Переподключение...', 'waiting');
          }
        });
      }

      // --- 2. Параллельный пул MQTT 3.1.1 over WSS (обход любых блокировок VPN/NAT) ---
      function mqttEncodeLength(len) {
        const bytes = [];
        do {
          let b = len % 128;
          len = Math.floor(len / 128);
          if (len > 0) b |= 128;
          bytes.push(b);
        } while (len > 0);
        return bytes;
      }

      function mqttEncodeString(str) {
        const utf8 = textEncoder.encode(str);
        return [(utf8.length >> 8) & 0xff, utf8.length & 0xff, ...utf8];
      }

      function mqttBuildConnectPacket(clientId) {
        const varHeader = [0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c];
        const body = [...varHeader, ...mqttEncodeString(clientId)];
        return new Uint8Array([0x10, ...mqttEncodeLength(body.length), ...body]);
      }

      function mqttBuildSubscribePacket(topic) {
        const body = [0x00, 0x01, ...mqttEncodeString(topic), 0x00];
        return new Uint8Array([0x82, ...mqttEncodeLength(body.length), ...body]);
      }

      function mqttBuildPublishPacket(topic, payloadStr) {
        const topicBytes = mqttEncodeString(topic);
        const msgBytes = textEncoder.encode(payloadStr);
        const remLen = mqttEncodeLength(topicBytes.length + msgBytes.length);
        const packet = new Uint8Array(1 + remLen.length + topicBytes.length + msgBytes.length);
        packet[0] = 0x30;
        packet.set(remLen, 1);
        packet.set(topicBytes, 1 + remLen.length);
        packet.set(msgBytes, 1 + remLen.length + topicBytes.length);
        return packet;
      }

      function publishWssMessage(data) {
        let packet = null;
        wssPool.forEach((entry) => {
          if (entry.connected && entry.socket && entry.socket.readyState === WebSocket.OPEN) {
            try {
              if (!packet) {
                packet = mqttBuildPublishPacket(roomTopic, JSON.stringify(data));
              }
              entry.socket.send(packet);
            } catch (_) {}
          }
        });
      }

      function initWssPool() {
        WSS_BROKERS.forEach((brokerUrl) => {
          connectSingleWssBroker(brokerUrl);
        });
      }

      function connectSingleWssBroker(brokerUrl) {
        let ws;
        try {
          ws = new WebSocket(brokerUrl, 'mqtt');
          ws.binaryType = 'arraybuffer';
        } catch (_) {
          setTimeout(() => connectSingleWssBroker(brokerUrl), 5000);
          return;
        }

        const state = {
          socket: ws,
          connected: false,
          pingTimer: null
        };
        wssPool.set(brokerUrl, state);

        const connectTimeout = setTimeout(() => {
          if (!state.connected) {
            try {
              ws.close();
            } catch (_) {}
          }
        }, 7000);

        ws.onopen = () => {
          const mqttClientId = `wp_${myClientId}_${Math.random().toString(36).slice(2, 7)}`;
          try {
            ws.send(mqttBuildConnectPacket(mqttClientId));
          } catch (_) {}
        };

        ws.onmessage = (event) => {
          const buf = new Uint8Array(event.data);
          let offset = 0;

          while (offset < buf.length) {
            const packetType = buf[offset] >> 4;
            let multiplier = 1;
            let remLen = 0;
            let idx = offset + 1;
            let encodedByte;

            do {
              if (idx >= buf.length) return;
              encodedByte = buf[idx++];
              remLen += (encodedByte & 127) * multiplier;
              multiplier *= 128;
            } while ((encodedByte & 128) !== 0);

            const packetEnd = idx + remLen;
            if (packetEnd > buf.length) break;

            // CONNACK (успешное подключение к MQTT брокеру)
            if (packetType === 2) {
              clearTimeout(connectTimeout);
              state.connected = true;
              try {
                ws.send(mqttBuildSubscribePacket(roomTopic));
              } catch (_) {}

              if (state.pingTimer) clearInterval(state.pingTimer);
              state.pingTimer = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) {
                  try {
                    ws.send(new Uint8Array([0xc0, 0x00]));
                  } catch (_) {}
                }
              }, 25000);

              if (!isHost && !guestConnectedToRoom) {
                markGuestConnected();
              }

              setTimeout(() => {
                sendNetworkMessage({
                  type: 'presence',
                  action: 'join',
                  role: isHost ? 'host' : 'guest'
                });
              }, 100);
            }

            // PUBLISH (входящее сообщение из комнаты)
            if (packetType === 3) {
              const qos = (buf[offset] >> 1) & 0x03;
              const topicLen = (buf[idx] << 8) | buf[idx + 1];
              let payloadStart = idx + 2 + topicLen;
              if (qos > 0) payloadStart += 2;

              if (payloadStart <= packetEnd) {
                try {
                  const jsonStr = textDecoder.decode(buf.subarray(payloadStart, packetEnd));
                  const parsed = JSON.parse(jsonStr);
                  handleIncomingData(parsed);
                } catch (_) {}
              }
            }

            offset = packetEnd;
          }
        };

        ws.onerror = () => {};

        ws.onclose = () => {
          clearTimeout(connectTimeout);
          state.connected = false;
          if (state.pingTimer) {
            clearInterval(state.pingTimer);
            state.pingTimer = null;
          }
          setTimeout(() => connectSingleWssBroker(brokerUrl), 4000);
        };
      }

      // --- Обработчики кнопок интерфейса ---
      copyRoomBtn.addEventListener('click', async () => {
        const shareUrl = window.location.href;
        try {
          await navigator.clipboard.writeText(shareUrl);
          const originalText = copyRoomBtn.textContent;
          copyRoomBtn.textContent = '✅ Ссылка скопирована!';
          addLog('Ссылка на комнату скопирована в буфер обмена', 'info');
          setTimeout(() => {
            copyRoomBtn.textContent = originalText;
          }, 2000);
        } catch (_) {
          window.prompt('Скопируйте ссылку на комнату:', shareUrl);
        }
      });

      newRoomBtn.addEventListener('click', () => {
        const freshRoomId = generateShortId('wp');
        sessionStorage.setItem('wp_host_room', freshRoomId);
        window.location.href = `${window.location.pathname}?room=${encodeURIComponent(freshRoomId)}`;
      });

      function handleLoadVideoClick() {
        const rawUrl = videoUrlInput.value;
        const embedUrl = parseRutubeToEmbed(rawUrl);

        if (!embedUrl) {
          addLog('Неверная ссылка Rutube. Пример: https://rutube.ru/video/c6582a09.../', 'warn');
          videoUrlInput.focus();
          return;
        }

        loadEmbedVideo(embedUrl, { isRemote: false, initialTime: 0, initialState: 'paused' });

        sendNetworkMessage({
          type: 'load-video',
          embedUrl: embedUrl,
          time: 0,
          state: 'paused'
        });
      }

      loadVideoBtn.addEventListener('click', handleLoadVideoClick);
      videoUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleLoadVideoClick();
        }
      });

      forceSyncBtn.addEventListener('click', () => {
        if (!currentEmbedUrl) {
          addLog('Сначала загрузите видео для синхронизации', 'warn');
          return;
        }

        const liveTime = getLiveCurrentTime();
        const tc = formatTimecode(liveTime);
        addLog(
          `Вы запустили принудительную синхронизацию всех ко времени ${tc} (${localState === 'playing' ? 'Играет' : 'Пауза'})`,
          'sync'
        );

        sendNetworkMessage({
          type: 'sync',
          action: 'force-sync',
          state: localState,
          time: liveTime,
          embedUrl: currentEmbedUrl,
          force: true
        });

        // Если принудительная синхронизация вызвана во время воспроизведения —
        // придерживаем свой плеер на 450 мс, пока остальные перематывают буфер
        if (localState === 'playing') {
          holdLocalPlayerForCoordinatedStart(450);
        }
      });

      // Запуск приложения
      initPeerNetwork();
    })();
  </script>
</body>
</html>
